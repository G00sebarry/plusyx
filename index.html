<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plusyx Task Manager</title>

    <!-- ───────── ИКОНКИ ─────────────────────────────────────────── -->
    <!-- Favicon во вкладке браузера -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />

    <!-- iOS «На экран Домой» — берётся именно эта иконка -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Web App Manifest — для Android и PWA-фич -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Цвет адресной строки (тёмная тема — по умолчанию) -->
    <meta name="theme-color" content="#121212" />

    <!-- Названия при сохранении на домашний экран -->
    <meta name="apple-mobile-web-app-title" content="Plusyx" />
    <meta name="application-name" content="Plusyx" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- ─────────────────────────────────────────────────────────── -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ───── СВЕТЛАЯ ТЕМА: системная палитра ───── */
            /* Фоновые уровни (от далёкого к близкому) */
            --tg-theme-bg-color: #FAFAF7;              /* canvas — основной фон страницы (тёплый off-white) */
            --tg-theme-secondary-bg-color: #FFFFFF;    /* surface-1 — карточки, модалки (приподнятые) */
            --surface-2: #F2F1ED;                      /* surface-2 — инпуты, чек-листы, секции внутри карточек */
            --surface-3: #E8E7E2;                      /* surface-3 — разделители, hover-состояния */
            
            /* Текст по уровням важности */
            --tg-theme-text-color: #1A1A1A;            /* primary — основной текст */
            --text-secondary: #5C5C5C;                 /* secondary — даты, метки, счётчики */
            --tg-theme-hint-color: #8E8E8E;            /* tertiary — подсказки, плейсхолдеры */
            --text-quaternary: #B5B5B5;                /* quaternary — дизейблед */
            
            /* Бордеры по силе */
            --border-subtle: rgba(0, 0, 0, 0.06);
            --border-default: rgba(0, 0, 0, 0.10);
            --border-strong: rgba(0, 0, 0, 0.15);
            --tg-theme-border-color: rgba(0, 0, 0, 0.08);
            
            /* Тени — это критично для светлой темы (создают глубину) */
            --tg-theme-card-shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.06);
            --shadow-modal: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
            --shadow-elevated: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.05);
            
            /* Системные элементы */
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-surface-overlay: rgba(0, 0, 0, 0.04);
            
            /* Plusyx Colors */
            --plusyx-purple: #9d73d2;
            --plusyx-green: #4cc3a1;
            --plusyx-shadow: #000000;
        }

        body {
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .dark {
            --tg-theme-bg-color: #121212;
            --tg-theme-secondary-bg-color: #1e1e1e;
            --surface-2: #2a2a2a;
            --surface-3: #353535;
            --tg-theme-text-color: #ffffff;
            --text-secondary: #B5B5B5;
            --tg-theme-hint-color: #777777;
            --text-quaternary: #555555;
            --border-subtle: rgba(255, 255, 255, 0.04);
            --border-default: rgba(255, 255, 255, 0.06);
            --border-strong: rgba(255, 255, 255, 0.10);
            --tg-theme-surface-overlay: rgba(255, 255, 255, 0.05);
            --tg-theme-border-color: rgba(255, 255, 255, 0.06);
            --tg-theme-card-shadow: none;
            --shadow-modal: 0 8px 32px rgba(0,0,0,0.5);
            --shadow-elevated: none;
        }

        /* ===== LIGHT THEME OVERRIDES ===== */
        /* cover-preserve: marker class for elements with bg images/covers */
        /* Elements inside .cover-preserve keep white text & dark overlays */
        
        /* bg-white/X → light overlays (not inside covers) */
        body:not(.dark) .bg-white\/5:not(.cover-preserve *) { background-color: rgba(0,0,0,0.03) !important; }
        body:not(.dark) .bg-white\/10:not(.cover-preserve *) { background-color: rgba(0,0,0,0.05) !important; }
        body:not(.dark) .bg-white\/15:not(.cover-preserve *) { background-color: rgba(0,0,0,0.06) !important; }
        body:not(.dark) .bg-white\/20:not(.cover-preserve *) { background-color: rgba(0,0,0,0.08) !important; }
        body:not(.dark) .hover\:bg-white\/5:hover:not(.cover-preserve *) { background-color: rgba(0,0,0,0.04) !important; }
        body:not(.dark) .hover\:bg-white\/10:hover:not(.cover-preserve *) { background-color: rgba(0,0,0,0.06) !important; }
        body:not(.dark) .hover\:bg-white\/20:hover:not(.cover-preserve *) { background-color: rgba(0,0,0,0.1) !important; }
        
        /* text-white → dark text, EXCEPT inside .cover-preserve */
        body:not(.dark) .text-white:not(.cover-preserve):not(.cover-preserve *) { color: var(--tg-theme-text-color) !important; }
        body:not(.dark) .text-white\/40:not(.cover-preserve):not(.cover-preserve *) { color: rgba(0,0,0,0.3) !important; }
        body:not(.dark) .text-white\/60:not(.cover-preserve):not(.cover-preserve *) { color: rgba(0,0,0,0.5) !important; }
        body:not(.dark) .text-white\/70:not(.cover-preserve):not(.cover-preserve *) { color: rgba(0,0,0,0.6) !important; }
        body:not(.dark) .text-white\/80:not(.cover-preserve):not(.cover-preserve *) { color: rgba(0,0,0,0.7) !important; }
        body:not(.dark) .hover\:text-white:hover:not(.cover-preserve):not(.cover-preserve *) { color: var(--tg-theme-text-color) !important; }
        
        /* text-gray-X — используем системные уровни вместо хардкода */
        body:not(.dark) .text-gray-400:not(.cover-preserve):not(.cover-preserve *) { color: var(--tg-theme-hint-color) !important; }
        body:not(.dark) .text-gray-500:not(.cover-preserve):not(.cover-preserve *) { color: var(--text-secondary) !important; }
        body:not(.dark) .text-gray-600:not(.cover-preserve):not(.cover-preserve *) { color: var(--text-secondary) !important; }
        body:not(.dark) .text-gray-300:not(.cover-preserve):not(.cover-preserve *) { color: var(--text-quaternary) !important; }
        
        /* border-white/X → dark borders */
        body:not(.dark) .border-white\/5 { border-color: rgba(0,0,0,0.06) !important; }
        body:not(.dark) .border-white\/10 { border-color: rgba(0,0,0,0.08) !important; }
        body:not(.dark) .border-white\/20 { border-color: rgba(0,0,0,0.12) !important; }
        body:not(.dark) .border-white\/30 { border-color: rgba(0,0,0,0.15) !important; }
        body:not(.dark) .border-gray-400\/10 { border-color: rgba(0,0,0,0.08) !important; }
        body:not(.dark) .border-gray-400\/20 { border-color: rgba(0,0,0,0.1) !important; }
        body:not(.dark) .border-gray-400\/30 { border-color: rgba(0,0,0,0.12) !important; }
        
        /* bg-black/X — тёплый surface вместо чёрной прозрачной плёнки */
        body:not(.dark) .bg-black\/5 { background-color: var(--surface-2) !important; }
        body:not(.dark) .bg-black\/10 { background-color: var(--surface-2) !important; }
        body:not(.dark) .bg-black\/20:not(.cover-preserve *) { background-color: var(--surface-3) !important; }
        body:not(.dark) .bg-black\/30:not(.cover-preserve *) { background-color: var(--surface-3) !important; }
        body:not(.dark) .bg-black\/60 { background-color: rgba(0,0,0,0.4) !important; }

        /* Dark bg elements in modals/dropdowns → white */
        body:not(.dark) .bg-\[\#1c1c1e\] { background-color: #ffffff !important; box-shadow: 0 4px 24px rgba(0,0,0,0.12) !important; }
        body:not(.dark) .bg-\[\#2c2c2e\] { background-color: #ffffff !important; box-shadow: 0 4px 24px rgba(0,0,0,0.12) !important; }
        body:not(.dark) .bg-\[\#121212\] { background-color: var(--tg-theme-bg-color) !important; }
        body:not(.dark) .bg-\[\#1e1e1e\] { background-color: var(--tg-theme-secondary-bg-color) !important; }
        
        /* Ring */
        body:not(.dark) .ring-white { --tw-ring-color: rgba(0,0,0,0.2) !important; }
        
        /* Gradients */
        body:not(.dark) .from-white:not(.cover-preserve *) { --tw-gradient-from: var(--tg-theme-text-color) !important; }
        body:not(.dark) .to-white\/60:not(.cover-preserve *) { --tw-gradient-to: rgba(0,0,0,0.5) !important; }
        body:not(.dark) .to-white\/40:not(.cover-preserve *) { --tw-gradient-to: rgba(0,0,0,0.3) !important; }
        
        /* Placeholders */
        body:not(.dark) .placeholder\:text-white\/20::placeholder { color: rgba(0,0,0,0.25) !important; }
        body:not(.dark) .placeholder\:opacity-30::placeholder { opacity: 0.4 !important; }
        
        /* Glows → softer */
        body:not(.dark) .shadow-\[0_0_10px_lime\] { box-shadow: 0 0 6px rgba(74,222,128,0.4) !important; }
        body:not(.dark) .shadow-\[0_0_10px_cyan\] { box-shadow: 0 0 6px rgba(34,211,238,0.4) !important; }
        body:not(.dark) .shadow-\[0_0_5px_yellow\] { box-shadow: 0 0 4px rgba(234,179,8,0.4) !important; }

        /* Colored buttons keep white text */
        body:not(.dark) .bg-green-500 .text-white,
        body:not(.dark) .bg-red-500 .text-white,
        body:not(.dark) .bg-blue-500 .text-white,
        body:not(.dark) .bg-green-500.text-white,
        body:not(.dark) .bg-red-500.text-white,
        body:not(.dark) .bg-blue-500.text-white,
        body:not(.dark) .tg-button,
        body:not(.dark) [class*="bg-green-500"] > svg,
        body:not(.dark) [class*="bg-\[var(--tg-theme-button-color)"] { color: #ffffff !important; }
        
        /* Card shadows — критично для светлой темы */
        body:not(.dark) .tg-secondary-bg { 
            box-shadow: var(--tg-theme-card-shadow); 
        }
        
        /* Модалки на светлой теме — заметно приподняты, с обводкой */
        body:not(.dark) .bg-\[\#1c1c1e\],
        body:not(.dark) .bg-\[\#2c2c2e\] { 
            background-color: #ffffff !important; 
            box-shadow: var(--shadow-modal) !important;
            border: 1px solid var(--border-subtle) !important;
        }
        
        /* Основная модалка задачи/привычки (.tg-bg внутри z-[200]) */
        body:not(.dark) .fixed.z-\[200\] > .relative.tg-bg,
        body:not(.dark) .fixed.z-\[200\] > .relative.w-full {
            box-shadow: var(--shadow-modal) !important;
            border: 1px solid var(--border-subtle) !important;
        }
        
        /* Backdrop за модалкой — чуть темнее для отделения */
        body:not(.dark) .bg-black\/60 { 
            background-color: rgba(20, 20, 20, 0.35) !important; 
            backdrop-filter: blur(8px);
        }
        
        /* Wallpaper: усиленный white wash overlay для читаемости */
        body:not(.dark) .wallpaper-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(250, 250, 247, 0.82);
            pointer-events: none;
            z-index: 1;
        }

        .font-logo { font-family: 'Space Grotesk', sans-serif; }

        /* === БАЗОВЫЕ УТИЛИТЫ ТЕМЫ === */
        .tg-bg { background-color: var(--tg-theme-bg-color); }
        .tg-secondary-bg { background-color: var(--tg-theme-secondary-bg-color); }
        .tg-text { color: var(--tg-theme-text-color); }
        .tg-hint { color: var(--tg-theme-hint-color); }
        .tg-button { background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); }
        
        /* === НОВЫЕ УТИЛИТЫ ДЛЯ СИСТЕМЫ ПОВЕРХНОСТЕЙ === */
        /* Используй .surface-2 для инпутов, чек-листов внутри карточек */
        /* Используй .surface-3 для разделителей и hover-состояний */
        .surface-2 { background-color: var(--surface-2); }
        .surface-3 { background-color: var(--surface-3); }
        .text-secondary { color: var(--text-secondary); }
        .text-quaternary { color: var(--text-quaternary); }
        .border-subtle { border-color: var(--border-subtle); }
        .border-default { border-color: var(--border-default); }
        .shadow-card { box-shadow: var(--tg-theme-card-shadow); }
        .shadow-elevated { box-shadow: var(--shadow-elevated); }
        .shadow-modal { box-shadow: var(--shadow-modal); }

        @keyframes breathe-plus {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.1); }
        }
        .animate-plus-new { animation: breathe-plus 2s infinite ease-in-out; }

        .logo-shadow {
            filter: drop-shadow(4px 4px 0px var(--plusyx-shadow));
        }

        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
        }
    </style>
<script type="importmap">

</script>

</head>

</body>
