
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plusyx Task Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-theme-bg-color: #f8f7f4;
            --tg-theme-secondary-bg-color: #eeecea;
            --tg-theme-text-color: #1a1a1a;
            --tg-theme-hint-color: #8a8a8a;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-surface-overlay: rgba(0, 0, 0, 0.04);
            --tg-theme-border-color: rgba(0, 0, 0, 0.08);
            --tg-theme-card-shadow: 0 1px 3px rgba(0,0,0,0.06);
            
            /* Plusyx Colors */
            --plusyx-purple: #9d73d2;
            --plusyx-green: #4cc3a1;
            --plusyx-shadow: #000000;
        }

        body {
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .dark {
            --tg-theme-bg-color: #121212;
            --tg-theme-secondary-bg-color: #1e1e1e;
            --tg-theme-text-color: #ffffff;
            --tg-theme-hint-color: #777777;
            --tg-theme-surface-overlay: rgba(255, 255, 255, 0.05);
            --tg-theme-border-color: rgba(255, 255, 255, 0.06);
            --tg-theme-card-shadow: none;
        }

        /* ===== LIGHT THEME OVERRIDES ===== */
        /* Fix hardcoded dark-only colors for light theme */
        
        /* bg-white/X → transparent overlays */
        body:not(.dark) .bg-white\/5 { background-color: rgba(0,0,0,0.03) !important; }
        body:not(.dark) .bg-white\/10 { background-color: rgba(0,0,0,0.05) !important; }
        body:not(.dark) .bg-white\/15 { background-color: rgba(0,0,0,0.06) !important; }
        body:not(.dark) .bg-white\/20 { background-color: rgba(0,0,0,0.08) !important; }
        body:not(.dark) .hover\:bg-white\/5:hover { background-color: rgba(0,0,0,0.04) !important; }
        body:not(.dark) .hover\:bg-white\/10:hover { background-color: rgba(0,0,0,0.06) !important; }
        body:not(.dark) .hover\:bg-white\/20:hover { background-color: rgba(0,0,0,0.1) !important; }
        
        /* text-white → dark text */
        body:not(.dark) .text-white { color: var(--tg-theme-text-color) !important; }
        body:not(.dark) .text-white\/40 { color: rgba(0,0,0,0.3) !important; }
        body:not(.dark) .text-white\/60 { color: rgba(0,0,0,0.5) !important; }
        body:not(.dark) .text-white\/70 { color: rgba(0,0,0,0.6) !important; }
        body:not(.dark) .text-white\/80 { color: rgba(0,0,0,0.7) !important; }
        body:not(.dark) .hover\:text-white:hover { color: var(--tg-theme-text-color) !important; }
        
        /* text-gray-X → appropriate light shades */
        body:not(.dark) .text-gray-400 { color: #8a8a8a !important; }
        body:not(.dark) .text-gray-500 { color: #6b6b6b !important; }
        body:not(.dark) .text-gray-600 { color: #555555 !important; }
        body:not(.dark) .text-gray-300 { color: #999999 !important; }
        
        /* border-white/X → dark borders */
        body:not(.dark) .border-white\/5 { border-color: rgba(0,0,0,0.06) !important; }
        body:not(.dark) .border-white\/10 { border-color: rgba(0,0,0,0.08) !important; }
        body:not(.dark) .border-white\/20 { border-color: rgba(0,0,0,0.12) !important; }
        body:not(.dark) .border-white\/30 { border-color: rgba(0,0,0,0.15) !important; }
        body:not(.dark) .border-gray-400\/10 { border-color: rgba(0,0,0,0.08) !important; }
        body:not(.dark) .border-gray-400\/20 { border-color: rgba(0,0,0,0.1) !important; }
        body:not(.dark) .border-gray-400\/30 { border-color: rgba(0,0,0,0.12) !important; }
        
        /* bg-black/X stays mostly fine, but some need adjustment */
        body:not(.dark) .bg-black\/5 { background-color: rgba(0,0,0,0.03) !important; }
        body:not(.dark) .bg-black\/10 { background-color: rgba(0,0,0,0.05) !important; }
        body:not(.dark) .bg-black\/20 { background-color: rgba(0,0,0,0.06) !important; }
        body:not(.dark) .bg-black\/30 { background-color: rgba(0,0,0,0.08) !important; }
        body:not(.dark) .bg-black\/60 { background-color: rgba(0,0,0,0.4) !important; }

        /* Dark background elements in modals/dropdowns */
        body:not(.dark) .bg-\[\#1c1c1e\] { background-color: #ffffff !important; box-shadow: 0 4px 24px rgba(0,0,0,0.12) !important; }
        body:not(.dark) .bg-\[\#2c2c2e\] { background-color: #ffffff !important; box-shadow: 0 4px 24px rgba(0,0,0,0.12) !important; }
        body:not(.dark) .bg-\[\#121212\] { background-color: var(--tg-theme-bg-color) !important; }
        body:not(.dark) .bg-\[\#1e1e1e\] { background-color: var(--tg-theme-secondary-bg-color) !important; }
        
        /* Ring overrides */
        body:not(.dark) .ring-white { --tw-ring-color: rgba(0,0,0,0.2) !important; }
        
        /* Gradient text that assumes dark bg */
        body:not(.dark) .from-white { --tw-gradient-from: var(--tg-theme-text-color) !important; }
        body:not(.dark) .to-white\/60 { --tw-gradient-to: rgba(0,0,0,0.5) !important; }
        body:not(.dark) .to-white\/40 { --tw-gradient-to: rgba(0,0,0,0.3) !important; }
        
        /* Placeholder colors */
        body:not(.dark) .placeholder\:text-white\/20::placeholder { color: rgba(0,0,0,0.25) !important; }
        body:not(.dark) .placeholder\:opacity-30::placeholder { opacity: 0.4 !important; }
        
        /* Shadow/glow overrides for light mode */
        body:not(.dark) .shadow-\[0_0_10px_lime\] { box-shadow: 0 0 6px rgba(74,222,128,0.4) !important; }
        body:not(.dark) .shadow-\[0_0_10px_cyan\] { box-shadow: 0 0 6px rgba(34,211,238,0.4) !important; }
        body:not(.dark) .shadow-\[0_0_5px_yellow\] { box-shadow: 0 0 4px rgba(234,179,8,0.4) !important; }

        /* Buttons that are white text on dark theme need to keep white text */
        body:not(.dark) .bg-green-500 .text-white,
        body:not(.dark) .bg-red-500 .text-white,
        body:not(.dark) .bg-blue-500 .text-white,
        body:not(.dark) .bg-green-500.text-white,
        body:not(.dark) .bg-red-500.text-white,
        body:not(.dark) .bg-blue-500.text-white,
        body:not(.dark) .tg-button,
        body:not(.dark) [class*="bg-green-500"] > svg,
        body:not(.dark) [class*="bg-\[var(--tg-theme-button-color)"] { color: #ffffff !important; }
        
        /* Cards get subtle shadows in light mode */
        body:not(.dark) .tg-secondary-bg { box-shadow: var(--tg-theme-card-shadow); }

        .font-logo { font-family: 'Space Grotesk', sans-serif; }

        .tg-bg { background-color: var(--tg-theme-bg-color); }
        .tg-secondary-bg { background-color: var(--tg-theme-secondary-bg-color); }
        .tg-text { color: var(--tg-theme-text-color); }
        .tg-hint { color: var(--tg-theme-hint-color); }
        .tg-button { background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); }

        @keyframes breathe-plus {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.1); filter: brightness(1.1); }
        }
        .animate-plus-new { animation: breathe-plus 2s infinite ease-in-out; }

        .logo-shadow {
            filter: drop-shadow(4px 4px 0px var(--plusyx-shadow));
        }

        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>

</head>

    <div id="root"></div>

</body>
</html>
